<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
<title id="title">Heathrow Airport to Southampton premium route illustration</title>
<desc id="desc">A premium sticker-style illustration showing Heathrow airport, a coach route and a cruise ship arriving in Southampton.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#dff1ff"/>
    <stop offset=".55" stop-color="#c6e4ff"/>
    <stop offset="1" stop-color="#edf7ff"/>
  </linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4aa8e8"/>
    <stop offset="1" stop-color="#1f76bd"/>
  </linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#33425d"/>
    <stop offset="1" stop-color="#1f2f48"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9ed4f4"/>
    <stop offset="1" stop-color="#3f8fc8"/>
  </linearGradient>
  <linearGradient id="ship" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#e8eef6"/>
  </linearGradient>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#17375f" flood-opacity=".24"/>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#183c69" flood-opacity=".18"/>
  </filter>
  <clipPath id="clip">
    <path d="M95 49C69 52 50 72 48 98L28 432c-2 34 20 61 54 66l631 72c30 4 58-12 69-41l91-245c10-28-1-59-27-74L654 97c-17-10-37-14-57-11L95 49Z"/>
  </clipPath>
</defs>

<g filter="url(#shadow)">
  <path d="M95 49C69 52 50 72 48 98L28 432c-2 34 20 61 54 66l631 72c30 4 58-12 69-41l91-245c10-28-1-59-27-74L654 97c-17-10-37-14-57-11L95 49Z"
        fill="#fff" stroke="#fff" stroke-width="22" stroke-linejoin="round"/>
  <g clip-path="url(#clip)">
    <rect width="900" height="600" fill="url(#sky)"/>

    <!-- clouds -->
    <g fill="#fff" opacity=".82">
      <ellipse cx="154" cy="112" rx="48" ry="18"/><ellipse cx="193" cy="108" rx="37" ry="24"/><ellipse cx="225" cy="116" rx="45" ry="17"/>
      <ellipse cx="615" cy="120" rx="44" ry="16"/><ellipse cx="650" cy="114" rx="32" ry="22"/><ellipse cx="681" cy="121" rx="39" ry="15"/>
    </g>

    <!-- airport apron -->
    <path d="M0 382L506 338 570 504 0 530Z" fill="#dfe6ee"/>
    <path d="M0 418L515 369 528 397 0 460Z" fill="#becbd8"/>
    <path d="M45 443L474 392" stroke="#fff" stroke-width="7" stroke-dasharray="34 22" opacity=".92"/>

    <!-- Heathrow terminal -->
    <g filter="url(#soft)">
      <path d="M76 258L307 238 337 377 62 405Z" fill="#eef2f5" stroke="#fff" stroke-width="8"/>
      <path d="M88 276L298 258 315 332 75 356Z" fill="url(#glass)"/>
      <g stroke="#d9e4ed" stroke-width="4">
        <path d="M120 272L111 351"/><path d="M162 269L153 347"/><path d="M205 265L196 343"/><path d="M248 261L239 339"/>
      </g>
      <path d="M55 399L337 370 348 395 52 429Z" fill="#ffffff"/>
    </g>

    <!-- control tower -->
    <g filter="url(#soft)">
      <path d="M233 170L270 167 292 337 248 342Z" fill="#e9eef4" stroke="#fff" stroke-width="7"/>
      <path d="M219 164L280 159 292 184 222 190Z" fill="#233d61" stroke="#fff" stroke-width="6"/>
      <path d="M229 186L285 181 290 206 233 212Z" fill="url(#glass)"/>
      <path d="M247 145L260 144 263 162 250 163Z" fill="#314b6f"/>
    </g>

    <!-- plane -->
    <g transform="translate(205 116) rotate(7)" filter="url(#soft)">
      <path d="M0 29L122 15 183 0 195 8 153 30 214 39 219 49 147 45 88 79 72 75 105 44 18 53Z"
            fill="#fff" stroke="#d5e4f0" stroke-width="4" stroke-linejoin="round"/>
      <path d="M116 18L148 7 153 13 128 27Z" fill="#4d6cff"/>
      <path d="M144 43L181 47 181 54 146 50Z" fill="#4d6cff"/>
    </g>

    <!-- central route road -->
    <path d="M288 432C390 391 479 388 586 423C653 445 711 454 790 438"
          fill="none" stroke="#fff" stroke-width="58" stroke-linecap="round"/>
    <path d="M288 432C390 391 479 388 586 423C653 445 711 454 790 438"
          fill="none" stroke="url(#road)" stroke-width="43" stroke-linecap="round"/>
    <path d="M307 427C401 395 480 395 579 427C652 451 708 456 777 442"
          fill="none" stroke="#f7d84b" stroke-width="5" stroke-dasharray="25 20" stroke-linecap="round"/>

    <!-- coach -->
    <g transform="translate(405 346) rotate(5)" filter="url(#soft)">
      <rect x="0" y="0" width="159" height="79" rx="20" fill="#4d67f6" stroke="#fff" stroke-width="7"/>
      <path d="M19 15H119c14 0 22 8 26 20H19Z" fill="#bfe6ff"/>
      <path d="M19 39H145V52H19Z" fill="#304a82" opacity=".55"/>
      <rect x="20" y="18" width="36" height="19" rx="5" fill="#e7f7ff"/>
      <rect x="62" y="18" width="36" height="19" rx="5" fill="#e7f7ff"/>
      <rect x="104" y="18" width="27" height="19" rx="5" fill="#e7f7ff"/>
      <circle cx="35" cy="74" r="14" fill="#22314a" stroke="#fff" stroke-width="5"/>
      <circle cx="128" cy="74" r="14" fill="#22314a" stroke="#fff" stroke-width="5"/>
    </g>

    <!-- Southampton water -->
    <path d="M565 355C670 344 775 347 900 377V600H526C540 511 552 426 565 355Z" fill="url(#sea)"/>
    <g fill="none" stroke="#bfe9ff" stroke-width="5" opacity=".55">
      <path d="M589 499C650 480 702 487 762 505C816 521 858 516 900 504"/>
      <path d="M573 538C632 520 689 526 752 544C808 560 857 555 900 543"/>
    </g>

    <!-- port / skyline -->
    <g fill="#5b6d80" opacity=".92">
      <rect x="602" y="302" width="24" height="74" rx="2"/>
      <rect x="631" y="319" width="32" height="58" rx="2"/>
      <rect x="668" y="289" width="19" height="89" rx="2"/>
      <rect x="693" y="310" width="45" height="69" rx="2"/>
      <path d="M748 379V285h8v94zM752 286l45 44h-8l-37-32z" fill="#40556e"/>
    </g>

    <!-- cruise ship -->
    <g transform="translate(612 336)" filter="url(#soft)">
      <path d="M0 100H224l-27 54H38Z" fill="#1f3f68" stroke="#fff" stroke-width="7" stroke-linejoin="round"/>
      <path d="M25 24H186l24 77H8Z" fill="url(#ship)" stroke="#fff" stroke-width="7" stroke-linejoin="round"/>
      <path d="M53 0H156l22 29H37Z" fill="#fff" stroke="#d9e4ee" stroke-width="5"/>
      <rect x="81" y="-20" width="43" height="24" rx="5" fill="#304d72" stroke="#fff" stroke-width="5"/>
      <rect x="88" y="-38" width="8" height="19" fill="#314c6e"/>
      <rect x="108" y="-42" width="8" height="23" fill="#314c6e"/>
      <g fill="#83c7ee">
        <rect x="46" y="46" width="24" height="12" rx="3"/>
        <rect x="76" y="46" width="24" height="12" rx="3"/>
        <rect x="106" y="46" width="24" height="12" rx="3"/>
        <rect x="136" y="46" width="24" height="12" rx="3"/>
        <rect x="166" y="46" width="20" height="12" rx="3"/>
        <rect x="59" y="69" width="25" height="12" rx="3"/>
        <rect x="91" y="69" width="25" height="12" rx="3"/>
        <rect x="123" y="69" width="25" height="12" rx="3"/>
        <rect x="155" y="69" width="25" height="12" rx="3"/>
      </g>
      <path d="M31 103H202" stroke="#4d67f6" stroke-width="8"/>
    </g>

    <!-- luggage -->
    <g transform="translate(335 449)" filter="url(#soft)">
      <rect x="0" y="18" width="55" height="70" rx="12" fill="#ffb83e" stroke="#fff" stroke-width="7"/>
      <path d="M17 18V6h22v12" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
      <circle cx="14" cy="91" r="7" fill="#263c5a"/>
      <circle cx="42" cy="91" r="7" fill="#263c5a"/>
    </g>

    <!-- subtle gloss -->
    <path d="M72 94C185 55 365 65 505 86C389 119 228 151 90 178Z" fill="#fff" opacity=".14"/>
  </g>
  <path d="M95 49C69 52 50 72 48 98L28 432c-2 34 20 61 54 66l631 72c30 4 58-12 69-41l91-245c10-28-1-59-27-74L654 97c-17-10-37-14-57-11L95 49Z"
        fill="none" stroke="#fff" stroke-width="17" stroke-linejoin="round"/>
</g>
</svg>